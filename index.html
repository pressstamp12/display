<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Monitoring Produksi - TR 800T</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Pelapis penangkap klik agar klik di area gambar tetap memicu Fullscreen -->
    <div id="fullscreen-catcher" title="Klik di mana saja untuk layar penuh">
        <div class="fs-hint">KLIK DI MANA SAJA UNTUK MODE LAYAR PENUH (FULLSCREEN)</div>
    </div>

    <div id="file-container">
        <!-- Bar Atas "SEDANG PRODUKSI" (Tidak menimpa gambar) -->
        <div id="production-banner" class="hidden">
            <span class="pulse-dot"></span>
            <span id="production-text">SEDANG PRODUKSI</span>
        </div>

        <!-- Area Tampilan File Google Drive -->
        <div id="file-display"></div>

        <!-- Keterangan Instruksi Tambahan (Kolom C) -->
        <div id="instruction" class="hidden"></div>

        <!-- Pesan Error / Status Jaringan -->
        <div id="error-toast" class="hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
